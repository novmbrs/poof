services:
    poof:
        image: ghcr.io/novmbrs/poof:${POOF_VERSION:-latest}
        environment:
            REDIS_URL: redis://redis:6379
            POOF_DEFAULT_TTL_SECONDS: ${POOF_DEFAULT_TTL_SECONDS:-604800}
        ports:
            - "${POOF_PORT:-3000}:3000"
        depends_on:
            redis:
                condition: service_healthy
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes --appendfsync everysec
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        volumes:
            - redis-data:/data
        restart: unless-stopped

volumes:
    redis-data:
